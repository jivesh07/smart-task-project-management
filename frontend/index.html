<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow</title><link rel="stylesheet" href="style.css"></head><body>
<div id="toast"></div>
<section id="auth" class="auth"><div class="card"><h1>✓ TaskFlow</h1><p>Smart task & project management</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Create account</button></div>
<form id="authForm"><div id="nameBox" class="hide"><label>Name</label><input id="name"></div><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><button class="primary" id="authBtn">Login</button></form></div></section>
<section id="app" class="hide"><header><h2>✓ TaskFlow</h2><div><span id="welcome"></span><button id="logout">Logout</button></div></header><main>
<div class="hero"><div><small>WORKSPACE</small><h1>Manage your work with clarity.</h1><p>Create tasks, set priorities and track progress.</p></div><button class="primary" id="newTask">+ New Task</button></div>
<div class="stats"><div><small>Total</small><b id="total">0</b></div><div><small>To Do</small><b id="todo">0</b></div><div><small>In Progress</small><b id="progress">0</b></div><div><small>Completed</small><b id="done">0</b></div></div>
<div class="toolbar"><input id="search" placeholder="Search tasks..."><select id="filter"><option>All</option><option>Todo</option><option>In Progress</option><option>Completed</option></select></div>
<div id="tasks"></div><div id="empty" class="empty hide"><h3>No tasks found</h3><p>Create a task to get started.</p></div></main></section>
<div id="modal" class="modal hide"><div class="modalCard"><div class="modalHead"><h2 id="modalTitle">Create Task</h2><button id="close">×</button></div><form id="taskForm"><input type="hidden" id="taskId"><label>Title *</label><input id="title" maxlength="120" required><label>Description</label><textarea id="description" rows="4" maxlength="500"></textarea><div class="grid"><div><label>Priority</label><select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div><label>Status</label><select id="status"><option selected>Todo</option><option>In Progress</option><option>Completed</option></select></div></div><label>Due date</label><input id="dueDate" type="date"><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save Task</button></div></form></div></div><script src="script.js"></script></body></html>
